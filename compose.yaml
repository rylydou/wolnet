services:
  wolnet:
    image: ghcr.io/rylydou/wolnet:latest
    container_name: wolnet
    restart: unless-stopped

    # Wake-on-LAN packets are broadcasts, which can't leave Docker's own network. Host networking
    # puts WolNet directly on your LAN. It also means `ports:` doesn't apply: WolNet listens on
    # the host's port 8778 (change it with PORT).
    network_mode: host
    environment:
      PORT: 8778

    # The SQLite database. To keep it in a folder instead, use something like `./data:/data`.
    volumes:
      - data:/data

volumes:
  data:
